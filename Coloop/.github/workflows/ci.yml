name: Windows desktop checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: RK service recovery guards
        shell: pwsh
        run: |
          . ./scripts/workspace-cache.ps1
          python -m unittest discover -s tests -p test_rk_model_service.py -v
      - run: npm run format:check
      - run: npm run build
      # Full desktop packaging requires prepared offline runtime assets in .cache.
      # Validate/install that directory package locally with scripts/install-local.ps1.
