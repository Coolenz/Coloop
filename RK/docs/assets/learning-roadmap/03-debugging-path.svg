<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1260" viewBox="0 0 1480 1260" role="img" aria-label="故障定位：找到最早出现异常的环节">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs>
<style>text {font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'SimHei', sans-serif;}</style>
<rect width="1480" height="1260" fill="#f5f8fc"/>
<rect width="1480" height="10" fill="#2563eb"/>

<text x="48" y="78" font-size="38" fill="#172b45" font-weight="700" text-anchor="start">故障定位：找到最早出现异常的环节</text>
<text x="48" y="120" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">自上而下检查；任一项不通过，先处理右侧问题，再返回同一环节复测。</text>
<text x="64" y="178" font-size="18" fill="#52667e" font-weight="700" text-anchor="start">检查点</text>
<text x="634" y="178" font-size="18" fill="#52667e" font-weight="700" text-anchor="start">不通过时优先排查</text>
<rect x="64" y="207" width="462" height="105" rx="20" fill="#edf3ff" stroke="#cfddf4"/>
<text x="295" y="269" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">环境可以初始化？</text>
<path d="M535 260 L613 260" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="574" y="244" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">否</text>
<rect x="634" y="207" width="797" height="105" rx="20" fill="white" stroke="#dce4ee"/>
<text x="658" y="250" font-size="21" fill="#172b45" font-weight="400" text-anchor="start">系统 / CPU 架构 / Python / wheel 是否匹配</text>
<text x="658" y="284" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">依赖冲突、动态库与安装日志</text>
<path d="M295 317 L295 343" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="324" y="337" font-size="16" fill="#087f70" font-weight="700" text-anchor="start">是</text>
<rect x="64" y="350" width="462" height="105" rx="20" fill="#edf3ff" stroke="#cfddf4"/>
<text x="295" y="412" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">原模型结果正常？</text>
<path d="M535 403 L613 403" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="574" y="387" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">否</text>
<rect x="634" y="350" width="797" height="105" rx="20" fill="white" stroke="#dce4ee"/>
<text x="658" y="393" font-size="21" fill="#172b45" font-weight="400" text-anchor="start">模型资料是否完整，任务是否超出模型能力</text>
<text x="658" y="427" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">Tokenizer、chat template、EOS、生成参数</text>
<path d="M295 460 L295 486" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="324" y="480" font-size="16" fill="#087f70" font-weight="700" text-anchor="start">是</text>
<rect x="64" y="493" width="462" height="105" rx="20" fill="#edf3ff" stroke="#cfddf4"/>
<text x="295" y="555" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">转换并导出成功？</text>
<path d="M535 546 L613 546" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="574" y="530" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">否</text>
<rect x="634" y="493" width="797" height="105" rx="20" fill="white" stroke="#dce4ee"/>
<text x="658" y="536" font-size="21" fill="#172b45" font-weight="400" text-anchor="start">架构与 SDK 支持、校准数据格式、目标配置</text>
<text x="658" y="570" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">主机 RAM / 磁盘、构建阶段、完整转换日志</text>
<path d="M295 603 L295 629" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="324" y="623" font-size="16" fill="#087f70" font-weight="700" text-anchor="start">是</text>
<rect x="64" y="636" width="462" height="105" rx="20" fill="#edf3ff" stroke="#cfddf4"/>
<text x="295" y="698" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">板端加载并运行？</text>
<path d="M535 689 L613 689" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="574" y="673" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">否</text>
<rect x="634" y="636" width="797" height="105" rx="20" fill="white" stroke="#dce4ee"/>
<text x="658" y="679" font-size="21" fill="#172b45" font-weight="400" text-anchor="start">上传文件摘要、目标芯片、可用内存</text>
<text x="658" y="713" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">Runtime / 头文件 / 驱动兼容性、动态库路径</text>
<path d="M295 746 L295 772" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="324" y="766" font-size="16" fill="#087f70" font-weight="700" text-anchor="start">是</text>
<rect x="64" y="779" width="462" height="105" rx="20" fill="#edf3ff" stroke="#cfddf4"/>
<text x="295" y="841" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">效果满足任务要求？</text>
<path d="M535 832 L613 832" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="574" y="816" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">否</text>
<rect x="634" y="779" width="797" height="105" rx="20" fill="white" stroke="#dce4ee"/>
<text x="658" y="822" font-size="21" fill="#172b45" font-weight="400" text-anchor="start">先对齐实际输入和参数，再分析量化损失</text>
<text x="658" y="856" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">上下文、缓存、独立测试题与失败案例</text>
<path d="M295 889 L295 915" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="324" y="909" font-size="16" fill="#087f70" font-weight="700" text-anchor="start">是</text>
<rect x="64" y="922" width="462" height="105" rx="20" fill="#edf3ff" stroke="#cfddf4"/>
<text x="295" y="984" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">性能与稳定性合格？</text>
<path d="M535 975 L613 975" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="574" y="959" font-size="17" fill="#b45309" font-weight="700" text-anchor="middle">否</text>
<rect x="634" y="922" width="797" height="105" rx="20" fill="white" stroke="#dce4ee"/>
<text x="658" y="965" font-size="21" fill="#172b45" font-weight="400" text-anchor="start">分开检查加载、Prefill、Decode 和内存</text>
<text x="658" y="999" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">温度 / 频率 / 负载、会话隔离与缓存清理</text>
<path d="M295 1033 L295 1080" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="324" y="1063" font-size="16" fill="#087f70" font-weight="700" text-anchor="start">是</text>
<rect x="64" y="1094" width="1367" height="90" rx="20" fill="#e4f5ef" stroke="#c4e7dd"/>
<text x="88" y="1130" font-size="24" fill="#087f70" font-weight="700" text-anchor="start">进入应用集成，保留可重复执行的基准与日志。</text>
<text x="88" y="1162" font-size="20" fill="#52667e" font-weight="400" text-anchor="start">每次只调整少量变量；新问题出现时，回到最早失败的检查点。</text>
<text x="48" y="1232" font-size="16" fill="#52667e" font-weight="400" text-anchor="start">学习路线 · 安装通过、导出成功、板端正确、业务可用是不同的验收层级。</text>
</svg>
