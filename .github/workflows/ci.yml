name: Windows desktop checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Coloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Coloop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: Coloop-Windows
          path: Coloop/release/*.exe
